<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dollar Shop</title>
  <!-- Tailwind CSS para diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- FontAwesome para Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex flex-col min-h-screen transition-colors duration-200">

  <!-- NAVBAR -->
  <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-40 transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-store text-indigo-600 dark:text-indigo-400 text-2xl"></i>
        <h1 class="text-xl font-bold text-gray-900 dark:text-white">Dollar Shop</h1>
      </div>
      <div class="flex items-center gap-3">
        <!-- Interruptor Modo Claro / Oscuro -->
        <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="Cambiar tema">
          <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
        </button>
        <!-- Botón Iniciar/Cerrar Sesión -->
        <button id="auth-btn" class="bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
          <i class="fa-solid fa-lock"></i> <span id="auth-btn-text">Iniciar Sesión</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- SECCIÓN CLIENTE -->
    <section id="catalog-section">
      <!-- Buscador y Filtros -->
      <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
        <!-- Buscador -->
        <div class="relative w-full md:w-1/3">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400 dark:text-gray-500"></i>
          <input type="text" id="search-input" placeholder="Buscar productos..." class="w-full pl-10 pr-4 py-2 border dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        
        <!-- Categorías (Filtros dinámicos) -->
        <div id="category-filters" class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
          <button class="category-btn active bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap" data-category="todos">
            Todos
          </button>
        </div>
      </div>

      <!-- Grid de Productos -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Tarjetas de productos se cargan dinámicamente -->
      </div>
      <p id="no-products-msg" class="hidden text-center text-gray-500 dark:text-gray-400 my-12">No hay productos disponibles en esta categoría.</p>
    </section>

    <!-- PANEL DE ADMINISTRACIÓN (Oculto por defecto) -->
    <section id="admin-panel" class="hidden space-y-8">
      <div class="bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800 p-4 rounded-xl flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-indigo-900 dark:text-indigo-200">Modo Administrador</h2>
          <p class="text-sm text-indigo-700 dark:text-indigo-400">Gestiona los artículos de Dollar Shop</p>
        </div>
        <span id="user-email" class="text-sm bg-indigo-200 dark:bg-indigo-800 text-indigo-800 dark:text-indigo-200 px-3 py-1 rounded-full font-medium"></span>
      </div>

      <!-- Formulario para agregar / editar productos (Sin Vista Previa) -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md border dark:border-gray-700">
        <div class="flex justify-between items-center mb-4">
          <h3 id="form-title" class="text-md font-bold text-gray-800 dark:text-white flex items-center gap-2">
            <i class="fa-solid fa-plus text-indigo-600 dark:text-indigo-400"></i> Agregar Nuevo Artículo
          </h3>
          <button id="cancel-edit-btn" class="hidden bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-1 rounded-lg text-sm transition">
            Cancelar Edición
          </button>
        </div>
        
        <form id="add-product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="hidden" id="edit-prod-id" value="">
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre del producto</label>
            <input type="text" id="prod-title" required class="w-full p-2 border dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoría</label>
            <input type="text" id="prod-category" placeholder="ej. Calzado, Electrónica..." required class="w-full p-2 border dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Precio ($)</label>
            <input type="number" step="0.01" id="prod-price" required class="w-full p-2 border dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
              Imagen (Subir desde Galería o Cámara)
            </label>
            <input type="file" id="prod-file" accept="image/*" class="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 dark:file:bg-gray-700 dark:file:text-indigo-300">
            <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">La imagen se comprimirá automáticamente antes de guardarse.</p>
          </div>
          
          <div class="md:col-span-2">
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold py-2 rounded-lg transition flex justify-center items-center gap-2">
              <span id="submit-btn-text">Guardar Artículo</span>
              <i id="submit-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Tabla de administración de productos con Edición y Eliminación -->
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md border dark:border-gray-700">
        <h3 class="text-md font-bold text-gray-800 dark:text-white mb-4">Inventario Actual</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">
                <th class="p-3">Imagen</th>
                <th class="p-3">Nombre</th>
                <th class="p-3">Categoría</th>
                <th class="p-3">Precio</th>
                <th class="p-3 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody id="admin-table-body" class="divide-y dark:divide-gray-700 text-sm">
              <!-- Filas de la tabla -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL DE LOGIN -->
  <div id="login-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md p-6 relative border dark:border-gray-700">
      <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Acceso Administrativo</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Correo Electrónico</label>
          <input type="email" id="login-email" required class="w-full p-2 border dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
          <input type="password" id="login-password" required class="w-full p-2 border dark:border-gray-700 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <p id="auth-error" class="text-red-500 text-xs hidden"></p>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold py-2 rounded-lg transition">
          Ingresar
        </button>
      </form>
    </div>
  </div>

  <!-- SCRIPT FIREBASE Y LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración de tu proyecto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCPdvXiBKQxFmxNJdqov1CSbNe16WWIXm8",
      authDomain: "nextcom--multiservicos-server.firebaseapp.com",
      projectId: "nextcom--multiservicos-server",
      storageBucket: "nextcom--multiservicos-server.firebasestorage.app",
      messagingSenderId: "1011344400777",
      appId: "1:1011344400777:web:e40a1a66d9f77046bd8158",
      measurementId: "G-YJZYPHRXZ6"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Estado global
    let allProducts = [];
    let selectedCategory = 'todos';
    let currentEditImageData = '';

    // Referencias DOM
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const authBtn = document.getElementById('auth-btn');
    const authBtnText = document.getElementById('auth-btn-text');
    const loginModal = document.getElementById('login-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const loginForm = document.getElementById('login-form');
    const adminPanel = document.getElementById('admin-panel');
    const userEmailSpan = document.getElementById('user-email');
    const authError = document.getElementById('auth-error');
    
    const addProductForm = document.getElementById('add-product-form');
    const editProdId = document.getElementById('edit-prod-id');
    const formTitle = document.getElementById('form-title');
    const submitBtnText = document.getElementById('submit-btn-text');
    const submitSpinner = document.getElementById('submit-spinner');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const prodFileInput = document.getElementById('prod-file');

    const productGrid = document.getElementById('product-grid');
    const categoryFiltersContainer = document.getElementById('category-filters');
    const searchInput = document.getElementById('search-input');
    const adminTableBody = document.getElementById('admin-table-body');
    const noProductsMsg = document.getElementById('no-products-msg');

    // MODO CLARO / OSCURO
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      themeIcon.classList.replace('fa-moon', 'fa-sun');
    } else {
      document.documentElement.classList.remove('dark');
      themeIcon.classList.replace('fa-sun', 'fa-moon');
    }

    themeToggleBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        themeIcon.classList.replace('fa-sun', 'fa-moon');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        themeIcon.classList.replace('fa-moon', 'fa-sun');
      }
    });

    // COMPRESIÓN DE IMÁGENES (HTML Canvas)
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // Retorna Base64 optimizado en JPEG
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // AUTENTICACIÓN
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authBtnText.textContent = "Cerrar Sesión";
        adminPanel.classList.remove('hidden');
        userEmailSpan.textContent = user.email;
      } else {
        authBtnText.textContent = "Iniciar Sesión";
        adminPanel.classList.add('hidden');
      }
    });

    authBtn.addEventListener('click', () => {
      if (auth.currentUser) {
        signOut(auth);
      } else {
        loginModal.classList.remove('hidden');
        loginModal.classList.add('flex');
      }
    });

    closeModalBtn.addEventListener('click', () => {
      loginModal.classList.add('hidden');
      loginModal.classList.remove('flex');
      authError.classList.add('hidden');
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginModal.classList.add('hidden');
        loginModal.classList.remove('flex');
        loginForm.reset();
        authError.classList.add('hidden');
      } catch (error) {
        authError.textContent = "Credenciales incorrectas o usuario no encontrado.";
        authError.classList.remove('hidden');
      }
    });

    // FIRESTORE: Sincronización en tiempo real
    const productsRef = collection(db, 'productos');
    onSnapshot(productsRef, (snapshot) => {
      allProducts = [];
      snapshot.forEach((doc) => {
        allProducts.push({ id: doc.id, ...doc.data() });
      });
      renderCatalog();
      renderAdminTable();
    });

    // RENDERIZAR CATÁLOGO
    function renderCatalog() {
      // Categorías únicas
      const categories = ['todos', ...new Set(allProducts.map(p => p.category.toLowerCase().trim()))];
      
      categoryFiltersContainer.innerHTML = categories.map(cat => `
        <button class="category-btn ${selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600'} px-4 py-2 rounded-full text-sm font-medium capitalize whitespace-nowrap transition" 
                data-category="${cat}">
          ${cat}
        </button>
      `).join('');

      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          selectedCategory = e.target.dataset.category;
          renderCatalog();
        });
      });

      // Filtrado por búsqueda y categoría
      const searchTerm = searchInput.value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const matchesCategory = selectedCategory === 'todos' || p.category.toLowerCase().trim() === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchTerm) || p.category.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      // Render de tarjetas
      if (filtered.length === 0) {
        productGrid.innerHTML = '';
        noProductsMsg.classList.remove('hidden');
      } else {
        noProductsMsg.classList.add('hidden');
        productGrid.innerHTML = filtered.map(prod => `
          <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden hover:shadow-lg transition flex flex-col border dark:border-gray-700">
            <img src="${prod.image}" alt="${prod.title}" class="h-48 w-full object-cover">
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-xs bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-semibold px-2 py-1 rounded-md uppercase">${prod.category}</span>
                <h3 class="font-bold text-gray-900 dark:text-white mt-2 text-lg">${prod.title}</h3>
              </div>
              <div class="mt-4 flex justify-between items-center">
                <span class="text-xl font-extrabold text-indigo-600 dark:text-indigo-400">$${parseFloat(prod.price).toFixed(2)}</span>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    searchInput.addEventListener('input', renderCatalog);

    // GUARDAR O EDITAR PRODUCTO
    addProductForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('prod-title').value;
      const category = document.getElementById('prod-category').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value);
      const file = prodFileInput.files[0];
      const isEditing = !!editProdId.value;

      if (!isEditing && !file) {
        alert("Por favor selecciona una imagen o toma una foto.");
        return;
      }

      // Activar indicador de carga
      submitSpinner.classList.remove('hidden');
      submitBtnText.textContent = isEditing ? "Actualizando..." : "Guardando...";

      try {
        let imageData = currentEditImageData;
        
        // Si el usuario seleccionó un nuevo archivo, comprimirlo
        if (file) {
          imageData = await compressImage(file, 800, 0.7);
        }

        const productData = { title, category, price, image: imageData };

        if (isEditing) {
          await updateDoc(doc(db, 'productos', editProdId.value), productData);
          resetForm();
        } else {
          await addDoc(productsRef, productData);
          resetForm();
        }
      } catch (err) {
        alert("Error al guardar: " + err.message);
      } finally {
        submitSpinner.classList.add('hidden');
      }
    });

    // CANCELAR EDICIÓN
    cancelEditBtn.addEventListener('click', resetForm);

    function resetForm() {
      addProductForm.reset();
      editProdId.value = '';
      currentEditImageData = '';
      formTitle.innerHTML = `<i class="fa-solid fa-plus text-indigo-600 dark:text-indigo-400"></i> Agregar Nuevo Artículo`;
      submitBtnText.textContent = "Guardar Artículo";
      cancelEditBtn.classList.add('hidden');
      prodFileInput.required = true;
    }

    // RENDERIZAR TABLA DE ADMINISTRACIÓN
    function renderAdminTable() {
      adminTableBody.innerHTML = allProducts.map(prod => `
        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
          <td class="p-3"><img src="${prod.image}" class="w-12 h-12 rounded object-cover"></td>
          <td class="p-3 font-semibold text-gray-800 dark:text-gray-200">${prod.title}</td>
          <td class="p-3 text-gray-600 dark:text-gray-400 capitalize">${prod.category}</td>
          <td class="p-3 font-medium text-gray-900 dark:text-white">$${parseFloat(prod.price).toFixed(2)}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="editProduct('${prod.id}')" class="text-indigo-600 hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300 p-2" title="Editar">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="deleteProduct('${prod.id}')" class="text-red-500 hover:text-red-700 dark:text-red-400 p-2" title="Eliminar">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // CARGAR DATOS EN EL FORMULARIO PARA EDITAR
    window.editProduct = (id) => {
      const prod = allProducts.find(p => p.id === id);
      if (!prod) return;

      editProdId.value = prod.id;
      document.getElementById('prod-title').value = prod.title;
      document.getElementById('prod-category').value = prod.category;
      document.getElementById('prod-price').value = prod.price;
      currentEditImageData = prod.image;
      prodFileInput.required = false; // No es obligatorio subir nueva imagen al editar

      formTitle.innerHTML = `<i class="fa-solid fa-pen-to-square text-indigo-600 dark:text-indigo-400"></i> Editar Artículo`;
      submitBtnText.textContent = "Actualizar Artículo";
      cancelEditBtn.classList.remove('hidden');

      window.scrollTo({ top: adminPanel.offsetTop - 80, behavior: 'smooth' });
    };

    // ELIMINAR PRODUCTO
    window.deleteProduct = async (id) => {
      if (confirm("¿Estás seguro de que deseas eliminar este artículo de Dollar Shop?")) {
        try {
          await deleteDoc(doc(db, 'productos', id));
          if (editProdId.value === id) resetForm();
        } catch (err) {
          alert("Error al eliminar: " + err.message);
        }
      }
    };
  </script>
</body>
</html>
